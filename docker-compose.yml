services:
  postgres:
    image: postgres:16-alpine
    container_name: dostock-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: dostock
    ports:
      - "5432:5432"
    volumes:
      - dostock_pgdata:/var/lib/postgresql/data

volumes:
  dostock_pgdata:
