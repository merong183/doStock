# Render Blueprint: https://render.com/docs/blueprint-spec
# Git push 후 Render 대시보드에서 환경 변수를 설정하세요.

services:
  - type: web
    name: dostock-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /health
    envVars:
      - key: CORS_ORIGINS
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: SERPER_API_KEY
        sync: false
      - key: NEWS_PROVIDER
        value: google_rss
      - key: AI_PROVIDER
        value: rules
      - key: ENABLE_TRANSLATION
        value: "true"
